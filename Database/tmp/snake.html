<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>🐍 Snake</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(160deg,#1a0a1f,#2d1b3d 50%,#0f0a14);font-family:system-ui,sans-serif;
color:#f8e1f0;padding:12px;user-select:none;-webkit-user-select:none}
h1{font-size:1.4rem;margin-bottom:8px}
.stats{display:flex;gap:18px;margin-bottom:10px;font-size:.95rem;opacity:.9}
.stats b{color:#ff7eb9}
#board{background:#120818;border:3px solid #ff7eb9;border-radius:12px;
box-shadow:0 0 24px rgba(255,126,185,.35);touch-action:none;max-width:100%}
.hint{margin-top:12px;font-size:.8rem;opacity:.7;text-align:center;max-width:360px;line-height:1.4}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
button{background:#ff7eb9;color:#1a0a1f;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.95rem;cursor:pointer}
button:active{transform:scale(.96)}
.pad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:50px 50px 50px;gap:6px;margin-top:14px;justify-items:center}
.pad button{width:60px;height:50px;padding:0;font-size:1.2rem}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}
.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
#overlay{position:fixed;inset:0;background:rgba(10,5,15,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10}
#overlay.show{display:flex}
#overlay p{font-size:1.3rem;font-weight:700}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div class="stats"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<canvas id="board" width="360" height="360"></canvas>
<div class="hint">Pfeiltasten · WASD · Wischen · Pad</div>
<div class="btns">
<button type="button" id="btnStart">▶ Start</button>
<button type="button" id="btnPause">⏸ Pause</button>
</div>
<div class="pad">
<button type="button" class="up" data-dir="up">▲</button>
<button type="button" class="left" data-dir="left">◀</button>
<button type="button" class="down" data-dir="down">▼</button>
<button type="button" class="right" data-dir="right">▶</button>
</div>
<div id="overlay"><p id="overlayText">Game Over</p><button type="button" id="btnAgain">Nochmal</button></div>
<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'),overlayText=document.getElementById('overlayText');
const CELL=20,COLS=canvas.width/CELL,ROWS=canvas.height/CELL,SPEED_MS=110;
let snake,dir,nextDir,food,score,best,running,timer,dead;
best=Number(localStorage.getItem('snake_best')||0);bestEl.textContent=best;
function reset(){
  snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};nextDir={...dir};
  score=0;dead=false;scoreEl.textContent='0';placeFood();overlay.classList.remove('show');draw();
}
function placeFood(){
  let ok=false;while(!ok){food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
  ok=!snake.some(s=>s.x===food.x&&s.y===food.y)}
}
function setDir(nx,ny){if(dir.x+nx===0&&dir.y+ny===0)return;nextDir={x:nx,y:ny}}
function tick(){
  if(!running||dead)return;dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;scoreEl.textContent=String(score);
    if(score>best){best=score;bestEl.textContent=String(best);localStorage.setItem('snake_best',String(best))}
    placeFood();
  }else snake.pop();
  draw();
}
function gameOver(){dead=true;running=false;clearInterval(timer);timer=null;
  overlayText.textContent='Game Over · '+score+' Punkte';overlay.classList.add('show')}
function draw(){
  ctx.fillStyle='#120818';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,126,185,.08)';ctx.lineWidth=1;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke()}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(canvas.width,j*CELL);ctx.stroke()}
  ctx.fillStyle='#ff4d6d';roundRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4,6);
  snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#ff7eb9':'#c44d8a';roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,5)});
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();
}
function start(){if(dead)reset();if(running)return;running=true;if(!timer)timer=setInterval(tick,SPEED_MS)}
function pause(){running=false;clearInterval(timer);timer=null}
document.getElementById('btnStart').onclick=start;
document.getElementById('btnPause').onclick=pause;
document.getElementById('btnAgain').onclick=()=>{reset();start()};
document.querySelectorAll('.pad button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const d=btn.dataset.dir;
    if(d==='up')setDir(0,-1);if(d==='down')setDir(0,1);
    if(d==='left')setDir(-1,0);if(d==='right')setDir(1,0);start();
  });
});
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','w'].includes(k)){e.preventDefault();setDir(0,-1);start()}
  if(['arrowdown','s'].includes(k)){e.preventDefault();setDir(0,1);start()}
  if(['arrowleft','a'].includes(k)){e.preventDefault();setDir(-1,0);start()}
  if(['arrowright','d'].includes(k)){e.preventDefault();setDir(1,0);start()}
  if(k===' '||k==='p'){e.preventDefault();running?pause():start()}
});
let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);start();
},{passive:true});
reset();
</script>
</body>
</html>
