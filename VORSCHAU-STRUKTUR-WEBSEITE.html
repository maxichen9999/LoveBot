<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Struktur-Vorschau — HelloKitty Baby Maxi 🎀</title>
<style>
  :root{
    --rosa:#e8608f; --rosa-dunkel:#b8385f; --rosa-hell:#ffe9f1; --rosa-zart:#fff5f8;
    --text:#2f2430; --text-leise:#7a6a76; --linie:#f0dbe4; --weiss:#ffffff;
    --gut:#2f9e6e; --warn:#c98a13; --weg:#c0455f;
    --schatten:0 1px 2px rgba(180,60,110,.06), 0 8px 24px rgba(180,60,110,.07);
    --rund:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--rosa-zart);color:var(--text);
       font:16px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.2px;margin:0}

  /* ── Kopf ── */
  header{background:var(--weiss);border-bottom:1px solid var(--linie);position:sticky;top:0;z-index:10}
  .zeile{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px}
  .kopf-oben{height:74px;justify-content:space-between}
  .marke{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
  .marke .zeichen{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--rosa),var(--rosa-dunkel));
    display:grid;place-items:center;font-size:19px;box-shadow:var(--schatten)}
  .marke b{display:block;font:600 15px/1.2 Georgia,serif;letter-spacing:.6px}
  .marke span{display:block;font-size:11.5px;color:var(--text-leise);letter-spacing:1.4px;text-transform:uppercase}
  .aktionen{display:flex;align-items:center;gap:10px}
  .knopf{border:1px solid var(--linie);background:var(--weiss);color:var(--text);border-radius:11px;
    padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit;transition:.16s}
  .knopf:hover{border-color:var(--rosa);color:var(--rosa-dunkel)}
  .knopf.primaer{background:linear-gradient(140deg,var(--rosa),var(--rosa-dunkel));color:#fff;border:none;
    box-shadow:0 4px 14px rgba(184,56,95,.25)}
  .knopf.primaer:hover{filter:brightness(1.06);color:#fff}

  /* ── Bereichsleiste ── */
  nav.bereiche{border-top:1px solid var(--linie);background:var(--weiss)}
  .bereiche .zeile{gap:6px;overflow-x:auto;padding-top:9px;padding-bottom:9px}
  .bereich{border:none;background:transparent;color:var(--text-leise);font:500 14.5px/1 inherit;
    padding:9px 14px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:.16s}
  .bereich:hover{background:var(--rosa-hell);color:var(--rosa-dunkel)}
  .bereich.aktiv{background:var(--rosa-hell);color:var(--rosa-dunkel);box-shadow:inset 0 0 0 1px var(--linie)}

  /* ── zweite Zeile: Seiten im Bereich ── */
  .unterleiste{background:var(--rosa-hell);border-bottom:1px solid var(--linie)}
  .unterleiste .zeile{gap:8px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .seite-chip{border:1px solid transparent;background:var(--weiss);color:var(--text);border-radius:999px;
    padding:6px 13px;font-size:13.5px;cursor:pointer;transition:.16s;font-family:inherit}
  .seite-chip:hover{border-color:var(--rosa);color:var(--rosa-dunkel)}

  /* ── Inhalt ── */
  main{max-width:1180px;margin:0 auto;padding:34px 22px 70px}
  .titel-klein{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--rosa-dunkel);margin-bottom:7px}
  h1{font-size:31px;margin-bottom:8px}
  .untertitel{color:var(--text-leise);margin:0 0 26px;max-width:70ch}

  .karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
  .karte{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--rund);padding:18px 19px;
    box-shadow:var(--schatten);transition:.18s;position:relative}
  .karte:hover{transform:translateY(-2px);border-color:#e9c6d6}
  .karte .emoji{font-size:23px;display:block;margin-bottom:9px}
  .karte h3{font-size:17.5px;margin-bottom:5px}
  .karte p{margin:0;color:var(--text-leise);font-size:14px}
  .karte .adresse{margin-top:11px;font:500 12.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--rosa-dunkel)}
  .marke-klein{position:absolute;top:15px;right:15px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
    padding:4px 8px;border-radius:999px}
  .m-neu{background:#e7f6ee;color:var(--gut)}
  .m-bleibt{background:var(--rosa-hell);color:var(--rosa-dunkel)}
  .m-weg{background:#fdeaee;color:var(--weg)}
  .m-warn{background:#fdf3e0;color:var(--warn)}

  /* ── Kennzahlen ── */
  .kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:30px}
  .kennzahl{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--rund);padding:16px 18px;box-shadow:var(--schatten)}
  .kennzahl b{display:block;font:600 27px/1.1 Georgia,serif;color:var(--rosa-dunkel)}
  .kennzahl span{font-size:13px;color:var(--text-leise)}

  .hinweis{background:var(--weiss);border:1px solid var(--linie);border-left:4px solid var(--rosa);
    border-radius:12px;padding:15px 18px;margin:26px 0;font-size:14.5px;box-shadow:var(--schatten)}
  .hinweis.stoer{border-left-color:var(--warn)}
  .hinweis b{color:var(--rosa-dunkel)}
  .bereich-kopf{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .bereich-kopf .emoji{font-size:26px}

  footer{background:var(--weiss);border-top:1px solid var(--linie);padding:26px 0;color:var(--text-leise);font-size:13.5px}
  footer .zeile{justify-content:space-between;flex-wrap:wrap;gap:12px}
  footer a{color:var(--rosa-dunkel);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media (max-width:640px){
    h1{font-size:25px}
    .marke span{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="zeile kopf-oben">
    <a class="marke" href="#" onclick="return false">
      <span class="zeichen">🎀</span>
      <span><b>HELLOKITTY BABY MAXI</b><span>Struktur-Vorschlag</span></span>
    </a>
    <div class="aktionen">
      <button class="knopf" onclick="zeige('aufraeumen')">🧹 Aufräumen</button>
      <button class="knopf primaer" onclick="zeige('start')">Dashboard →</button>
    </div>
  </div>

  <nav class="bereiche">
    <div class="zeile" id="bereichsleiste"></div>
  </nav>

  <div class="unterleiste">
    <div class="zeile" id="unterleiste"></div>
  </div>
</header>

<main id="inhalt"></main>

<footer>
  <div class="zeile">
    <span>🎀 <b>HelloKitty Baby Maxi</b> by Maxichen · Vorschau, noch nichts geändert</span>
    <span>
      <a href="#" onclick="return false">maxichen.de</a> ·
      <a href="#" onclick="return false">maxichen.de</a> ·
      <a href="#" onclick="return false">Datenschutz</a> ·
      <a href="#" onclick="return false">Impressum</a>
    </span>
  </div>
</footer>

<script>
/* ═══ Daten: die Bereiche und ihre Seiten ═══════════════════════════ */
var BEREICHE = [
  { id:'start', emoji:'🏠', name:'Start', kurz:'öffentlich', seiten:[
    { e:'🌸', t:'Startseite', a:'/',            d:'Dashboard-Vorschau: Live-Status, Kennzahlen, Schnellzugriff', m:'neu' },
    { e:'✨', t:'Funktionen', a:'/features.html', d:'Was der Bot alles kann', m:'bleibt' },
    { e:'📜', t:'Befehle',    a:'/cmd.html',      d:'Alle Befehle mit Suche', m:'bleibt' },
    { e:'🎮', t:'Spiele',     a:'/spiele.html',   d:'Spiele & Fun', m:'bleibt' },
    { e:'⭐', t:'Level',      a:'/level.html',    d:'Level-System, XP, Ränge', m:'bleibt' },
    { e:'📅', t:'Jahr 2026',  a:'/year.html',     d:'Das Jahr auf einen Blick', m:'bleibt' }
  ]},
  { id:'zahlen', emoji:'📊', name:'Zahlen', kurz:'öffentlich', seiten:[
    { e:'📡', t:'Live-Status', a:'/status.html',      d:'Ist der Bot da? Antwortzeiten, System', m:'bleibt' },
    { e:'📈', t:'Statistiken', a:'/statistics.html',  d:'Nutzer, Gruppen, Paare, Top-Befehle', m:'bleibt' },
    { e:'🏆', t:'Bestenliste', a:'/leaderboard.html', d:'Wer führt', m:'bleibt' },
    { e:'🌐', t:'HTTP-Codes',  a:'/http-codes.html',  d:'Was 404, 500 & Co. bedeuten', m:'bleibt' }
  ]},
  { id:'wissen', emoji:'📚', name:'Wissen', kurz:'öffentlich', seiten:[
    { e:'📖', t:'Dokumentation', a:'/docs.html',        d:'Anleitungen und Erklärungen', m:'bleibt' },
    { e:'❓', t:'FAQ',           a:'/faq.html',         d:'Häufige Fragen', m:'bleibt' },
    { e:'📕', t:'Regeln',        a:'/regeln.html',      d:'Community-Regeln', m:'bleibt' },
    { e:'🔒', t:'Datenschutz',   a:'/datenschutz.html', d:'Datenschutzerklärung', m:'bleibt' },
    { e:'📄', t:'Impressum',     a:'/impressum.html',   d:'Impressum', m:'bleibt' }
  ]},
  { id:'konto', emoji:'👤', name:'Mein Konto', kurz:'Login', seiten:[
    { e:'🏠', t:'Mein Dashboard', a:'/home.html',           d:'Der Einstieg nach dem Login', m:'neu' },
    { e:'💳', t:'Mein Account',   a:'/account.html',        d:'Level, Kupfer, Reports', m:'bleibt' },
    { e:'📈', t:'Fortschritt',    a:'/progression.html',    d:'XP, Stufen, Ziele', m:'bleibt' },
    { e:'💰', t:'Economy',        a:'/economy.html',        d:'Konto und Umsätze', m:'bleibt' },
    { e:'🏦', t:'Bank',           a:'/bank.html',           d:'Bank', m:'bleibt' },
    { e:'⚙️', t:'Einstellungen',  a:'/settings.html',       d:'Einstellungen', m:'bleibt' },
    { e:'👥', t:'Profile',        a:'/profiles.html',       d:'Profile', m:'bleibt' },
    { e:'🔔', t:'Benachrichtigungen', a:'/notifications.html', d:'Glocke und Verlauf', m:'bleibt' }
  ]},
  { id:'gruppe', emoji:'🛡️', name:'Gruppe & Moderation', kurz:'Login', seiten:[
    { e:'👥', t:'Gruppen verwalten', a:'/groups.html',    d:'Gruppen und ihre Schalter', m:'bleibt' },
    { e:'🚩', t:'Reports',           a:'/reports.html',   d:'Gemeldetes prüfen', m:'bleibt' },
    { e:'🚫', t:'Badwords',          a:'/badwords.html',  d:'Wortliste', m:'bleibt' },
    { e:'⛔', t:'Bans',              a:'/bans.html',      d:'Sperren', m:'bleibt' },
    { e:'🎫', t:'Tickets',           a:'/control.html#/tickets', d:'Anfragen beantworten', m:'bleibt' },
    { e:'📢', t:'Broadcast',         a:'/broadcast.html', d:'Nachricht an alle Gruppen', m:'bleibt' }
  ]},
  { id:'system', emoji:'⚙️', name:'System', kurz:'Owner', seiten:[
    { e:'📶', t:'Session-Center',  a:'/sessions.html', d:'Sessions, Uptime-Monitor, Aktivität', m:'bleibt' },
    { e:'🧾', t:'Logs',            a:'/logs.html',     d:'Bot-Logs', m:'bleibt' },
    { e:'👑', t:'Owner & Team',    a:'/owners.html',   d:'Rollen und Team', m:'bleibt' },
    { e:'🛠️', t:'Control Center', a:'/control.html',  d:'Owner-Verwaltung', m:'bleibt' },
    { e:'🎛️', t:'Control Center',  a:'/control.html',  d:'Systemsteuerung', m:'bleibt' },
    { e:'🤖', t:'LoveAI',          a:'/ai.html',       d:'KI-Einstellungen', m:'bleibt' },
    { e:'🌙', t:'Midnight Control', a:'/app.html',     d:'Bleibt — vorerst dunkel, wird später angeglichen', m:'warn' }
  ]}
];

var AUFRaeUMEN = [
  { e:'📄', t:'commands.html', a:'436 B',   d:'Verwaiste Mini-Seite ohne Navigation und ohne Skript. Das echte Verzeichnis ist /cmd.html.', m:'weg', grund:'doppelt' },
  { e:'📡', t:'session.html',  a:'1 056 B', d:'Doppelt zu /sessions.html (17 KB, mit Uptime-Monitor und Aktivitäts-Feed).', m:'weg', grund:'doppelt' },
  { e:'🧪', t:'test.html',     a:'22,7 KB', d:'System-Test-Seite, in keiner Navigation und nur in alten Notizen erwähnt.', m:'weg', grund:'altlast' },
  { e:'🌙', t:'app.html',      a:'938 B',   d:'Keine Altlast! Dahinter liegen 2 513 Zeilen Owner-Funktionen (night/app.js). Bleibt, wird nur aus der Haupt-Navigation genommen.', m:'warn', grund:'bleibt' }
];

var MARKEN = { neu:'neu', bleibt:'bleibt', weg:'wird entfernt', warn:'bleibt (dunkel)' };
var AKTIV = 'start';

/* ═══ Aufbau ═════════════════════════════════════════════════════════ */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

function baueLeisten(){
  document.getElementById('bereichsleiste').innerHTML =
    BEREICHE.map(function(b){
      return '<button class="bereich' + (b.id===AKTIV?' aktiv':'') + '" onclick="zeige(\'' + b.id + '\')">'
           + b.emoji + ' ' + esc(b.name) + '</button>';
    }).join('') + '<button class="bereich" onclick="zeige(\'aufraeumen\')">🧹 Aufräumen</button>';

  var b = BEREICHE.find(function(x){ return x.id===AKTIV; });
  document.getElementById('unterleiste').innerHTML = b
    ? b.seiten.map(function(s){
        return '<button class="seite-chip">' + s.e + ' ' + esc(s.t) + '</button>';
      }).join('')
    : '<span style="font-size:13.5px;color:var(--text-leise)">Was weg kann — und was bleiben muss</span>';
}

function karte(s){
  return '<div class="karte">'
    + '<span class="marke-klein m-' + s.m + '">' + esc(MARKEN[s.m]) + '</span>'
    + '<span class="emoji">' + s.e + '</span>'
    + '<h3>' + esc(s.t) + '</h3>'
    + '<p>' + esc(s.d) + '</p>'
    + '<div class="adresse">' + esc(s.a) + '</div>'
    + '</div>';
}

function zeige(id){
  AKTIV = id;
  baueLeisten();
  var main = document.getElementById('inhalt');

  if (id === 'aufraeumen'){
    main.innerHTML =
      '<div class="titel-klein">Aufräumen</div>'
      + '<h1>Was weg kann — und was bleiben muss</h1>'
      + '<p class="untertitel">Von 42 Seiten bleiben nach dem Aufräumen <b>39</b>. '
      + 'Nichts wird gelöscht, was eine Funktion trägt.</p>'
      + '<div class="karten">' + AUFRaeUMEN.map(karte).join('') + '</div>'
      + '<div class="hinweis stoer"><b>Bitte kurz bestätigen:</b> <code>app.html</code> sieht klein aus '
      + '(938 B), ist aber die dunkle Owner-Oberfläche mit 2 513 Zeilen Logik. '
      + 'Ich nehme sie nur aus der Navigation und stelle sie später auf das helle Aussehen um — '
      + 'löschen würde echte Funktionen zerstören.</div>';
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  var b = BEREICHE.find(function(x){ return x.id===id; });

  if (id === 'start'){
    main.innerHTML =
      '<div class="titel-klein">Bereich ' + b.emoji + ' ' + esc(b.name) + '</div>'
      + '<h1>Alles hat einen Platz</h1>'
      + '<p class="untertitel">Sieben Bereiche statt 42 loser Seiten. Oben stehen die Bereiche, '
      + 'darunter die Seiten darin — Navigation und Fußzeile gibt es nur einmal, damit nichts '
      + 'auseinanderläuft.</p>'
      + '<div class="kennzahlen">'
      +   '<div class="kennzahl"><b>42 → 39</b><span>Seiten nach dem Aufräumen</span></div>'
      +   '<div class="kennzahl"><b>7</b><span>Bereiche</span></div>'
      +   '<div class="kennzahl"><b>0</b><span>Seiten ohne Navigation</span></div>'
      +   '<div class="kennzahl"><b>1</b><span>Datei für Navigation und Fußzeile</span></div>'
      + '</div>'
      + '<div class="karten">' + b.seiten.map(karte).join('') + '</div>'
      + '<div class="hinweis"><b>So geht es weiter:</b> Erst die Navigation auf Bereiche umstellen '
      + '(wirkt sofort auf alle Seiten), dann die drei Altlasten entfernen, dann die Startseite als '
      + 'echtes Dashboard — danach Bereich für Bereich im neuen Aussehen.</div>';
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  main.innerHTML =
    '<div class="titel-klein">Bereich · ' + esc(b.kurz) + '</div>'
    + '<div class="bereich-kopf"><span class="emoji">' + b.emoji + '</span><h1>' + esc(b.name) + '</h1></div>'
    + '<p class="untertitel">' + b.seiten.length + ' Seiten gehören hierher.</p>'
    + '<div class="karten">' + b.seiten.map(karte).join('') + '</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

zeige('start');
</script>
</body>
</html>
