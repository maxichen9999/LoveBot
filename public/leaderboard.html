  .lb-tabs { display:flex; gap:8px; justify-content:center; margin: 6px 0 22px; flex-wrap:wrap; }

  .lb-row:nth-child(1) .rank { color:#fbbf24; }
  .lb-row:nth-child(2) .rank { color:#d1d5db; }
  .lb-row:nth-child(3) .rank { color:#d97706; }
  .rank { font-family: var(--mono); font-weight:900; font-size:16px; text-align:center; }
  .lb-name { font-weight:750; font-size:14px; }
  .lb-val { font-family: var(--mono); font-size:13px; color: var(--faint); text-align:right; }
  .lb-val b { color: #7dd3fc; }
  .lb-empty { text-align:center; color: var(--faint); padding: 30px 0; }
